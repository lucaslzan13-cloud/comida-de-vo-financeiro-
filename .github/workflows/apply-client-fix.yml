name: Apply client app fix
on:
  push:
    paths:
      - patch-trigger.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python tools/patch_clients_sync.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clientes.html google-sync.js
          git rm -f tools/patch_clients_sync.py patch-trigger.txt .github/workflows/apply-client-fix.yml
          git commit -m "Corrige clientes e sincronizacao" || exit 0
          git push
