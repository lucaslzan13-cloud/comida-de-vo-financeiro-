name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Criar chave de assinatura Android
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/comida-de-vo-debug.keystore" \
            -storepass comidadevo \
            -keypass comidadevo \
            -alias comidadevo \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Comida de Vó, OU=Aplicativos, O=Comida de Vó, L=Uba, ST=MG, C=BR"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Gerar APKs instaláveis assinados
        run: gradle :app:assembleDebug :financeiro:assembleDebug --no-daemon
      - name: Conferir APKs gerados
        run: |
          find app/build/outputs/apk/debug -maxdepth 1 -type f -print
          find financeiro/build/outputs/apk/debug -maxdepth 1 -type f -print
          jarsigner -verify -verbose -certs app/build/outputs/apk/debug/app-debug.apk | tail -5
          jarsigner -verify -verbose -certs financeiro/build/outputs/apk/debug/financeiro-debug.apk | tail -5
      - name: Preparar downloads diretos
        run: |
          rm -rf public
          mkdir -p public
          cp app/build/outputs/apk/debug/app-debug.apk public/ComidaDeVo-Clientes.apk
          cp financeiro/build/outputs/apk/debug/financeiro-debug.apk public/ComidaDeVo-Financeiro.apk
          printf '%s\n' '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comida de Vó</title></head><body><h1>Comida de Vó</h1><p><a href="ComidaDeVo-Clientes.apk">Baixar Clientes</a></p><p><a href="ComidaDeVo-Financeiro.apk">Baixar Financeiro</a></p></body></html>' > public/index.html
      - name: Publicar APKs em links diretos
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./android/public
          force_orphan: true
      - name: Publicar APKs como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: comida-de-vo-apks-instalaveis
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/financeiro/build/outputs/apk/debug/financeiro-debug.apk
          if-no-files-found: error
