name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'financeiro/**'
      - 'clientes.html'
      - 'google-sync.js'
      - 'manifest-clientes.json'
      - 'sw-clientes.js'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recuperar chave de assinatura estável
        uses: actions/cache@v4
        with:
          path: ~/.android/comida-de-vo-debug.keystore
          key: comida-de-vo-android-signing-v1
      - name: Criar chave de assinatura Android se necessário
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/comida-de-vo-debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/comida-de-vo-debug.keystore" \
              -storepass comidadevo \
              -keypass comidadevo \
              -alias comidadevo \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Comida de Vó, OU=Aplicativos, O=Comida de Vó, L=Uba, ST=MG, C=BR"
          fi
          echo "SHA1 DO APK:"
          keytool -list -v -keystore "$HOME/.android/comida-de-vo-debug.keystore" -storepass comidadevo -alias comidadevo | grep -E 'SHA1:|SHA-1:' | head -1
      - name: Ajustar Financeiro Google antes da compilação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('financeiro/build.gradle')
          s=p.read_text()
          s=s.replace("versionCode 26", "versionCode 27")
          s=s.replace("versionName '4.0.1'", "versionName '4.1.0'")
          s=s.replace("dependencies {\n", "dependencies {\n    implementation 'androidx.core:core:1.17.0'\n", 1)
          s=s.replace("import androidx.credentials.Credential;", "import androidx.core.content.ContextCompat;\nimport androidx.credentials.Credential;")
          s=s.replace("new CancellationSignal(),Executors.newSingleThreadExecutor(),new CredentialManagerCallback", "new CancellationSignal(),ContextCompat.getMainExecutor(a),new CredentialManagerCallback")
          old="root.addView(totals);margin(totals,0,9);\\n        buildLaunch();"
          new="root.addView(totals);margin(totals,0,9);\\n        if(!GoogleSync40.connected()){ TextView google=action(\"Conectar conta Google\",15); google.setTextColor(Color.WHITE); google.setBackground(bg(NAVY,14,0)); google.setOnClickListener(v->GoogleSync40.signIn(this)); root.addView(google); margin(google,0,9); }\\n        buildLaunch();"
          s=s.replace(old,new)
          old2="TextView backup=action(\"Fazer backup\",14);backup.setBackground(bg(Color.rgb(229,231,235),12,0));backup.setOnClickListener(v->backup());tools.addView(backup);margin(backup,6,0);"
          new2=old2
          s=s.replace("s = s.replace('"+old2+"', 'if(!GoogleSync40.connected()){ TextView backup=action(\"Conectar conta Google\",15);backup.setTextColor(Color.WHITE);backup.setBackground(bg(NAVY,14,0));backup.setOnClickListener(v->GoogleSync40.signIn(this));tools.addView(backup);margin(backup,6,0); }')", "s = s.replace('"+old2+"', '"+old2+"')")
          # Remove the old bottom Google-button replacement if present.
          marker="s = s.replace('TextView backup=action(\"Fazer backup\",14);backup.setBackground(bg(Color.rgb(229,231,235),12,0));backup.setOnClickListener(v->backup());tools.addView(backup);margin(backup,6,0);', 'if(!GoogleSync40.connected()){ TextView backup=action(\"Conectar conta Google\",15);backup.setTextColor(Color.WHITE);backup.setBackground(bg(NAVY,14,0));backup.setOnClickListener(v->GoogleSync40.signIn(this));tools.addView(backup);margin(backup,6,0); }')"
          replacement="s = s.replace('TextView backup=action(\"Fazer backup\",14);backup.setBackground(bg(Color.rgb(229,231,235),12,0));backup.setOnClickListener(v->backup());tools.addView(backup);margin(backup,6,0);', 'TextView backup=action(\"Fazer backup\",14);backup.setBackground(bg(Color.rgb(229,231,235),12,0));backup.setOnClickListener(v->backup());tools.addView(backup);margin(backup,6,0);')"
          s=s.replace(marker,replacement)
          p.write_text(s)
          PY
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Gerar APKs instaláveis assinados
        run: gradle :app:assembleDebug :financeiro:assembleDebug --no-daemon
      - name: Conferir APKs gerados
        run: |
          find app/build/outputs/apk/debug -maxdepth 1 -type f -print
          find financeiro/build/outputs/apk/debug -maxdepth 1 -type f -print
          jarsigner -verify -verbose -certs app/build/outputs/apk/debug/app-debug.apk | tail -5
          jarsigner -verify -verbose -certs financeiro/build/outputs/apk/debug/financeiro-debug.apk | tail -5
      - name: Preparar downloads diretos e versão web
        run: |
          rm -rf public
          mkdir -p public
          cp app/build/outputs/apk/debug/app-debug.apk public/ComidaDeVo-Clientes.apk
          cp financeiro/build/outputs/apk/debug/financeiro-debug.apk public/ComidaDeVo-Financeiro.apk
          cp ../clientes.html public/clientes.html
          cp ../google-sync.js public/google-sync.js
          cp ../manifest-clientes.json public/manifest-clientes.json
          cp ../sw-clientes.js public/sw-clientes.js
          printf '%s\n' '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comida de Vó</title></head><body><h1>Comida de Vó</h1><p><a href="clientes.html">Abrir Clientes</a></p><p><a href="ComidaDeVo-Clientes.apk">Baixar Clientes</a></p><p><a href="ComidaDeVo-Financeiro.apk">Baixar Financeiro</a></p></body></html>' > public/index.html
      - name: Publicar APKs e versão web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./android/public
          force_orphan: true
      - name: Publicar APKs como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: comida-de-vo-apks-instalaveis
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/financeiro/build/outputs/apk/debug/financeiro-debug.apk
          if-no-files-found: error