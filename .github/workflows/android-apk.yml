name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'financeiro/**'
      - 'clientes.html'
      - 'google-sync.js'
      - 'manifest-clientes.json'
      - 'sw-clientes.js'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recuperar chave de assinatura estável
        uses: actions/cache@v4
        with:
          path: ~/.android/comida-de-vo-debug.keystore
          key: comida-de-vo-android-signing-v1
      - name: Criar chave de assinatura Android se necessário
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/comida-de-vo-debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/comida-de-vo-debug.keystore" -storepass comidadevo -keypass comidadevo -alias comidadevo -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Comida de Vó, OU=Aplicativos, O=Comida de Vó, L=Uba, ST=MG, C=BR"
          fi
          echo "SHA1 DO APK:"
          keytool -list -v -keystore "$HOME/.android/comida-de-vo-debug.keystore" -storepass comidadevo -alias comidadevo | grep -E 'SHA1:|SHA-1:' | head -1
      - name: Ajustar Financeiro Google antes da compilação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('financeiro/src/main/java/br/com/comidadevo/financeiro/MainActivity.java')
          s=p.read_text()
          s=s.replace('import androidx.credentials.Credential;', 'import com.google.android.gms.auth.api.signin.GoogleSignIn;\nimport com.google.android.gms.auth.api.signin.GoogleSignInAccount;\nimport com.google.android.gms.auth.api.signin.GoogleSignInOptions;\nimport com.google.android.gms.common.api.ApiException;\nimport androidx.credentials.Credential;')
          s=s.replace('private static final int REQ_RESTORE=9001, REQ_BACKUP=9002;', 'private static final int REQ_RESTORE=9001, REQ_BACKUP=9002, REQ_GOOGLE=9003;')
          old='@Override protected void onActivityResult(int r,int c,Intent d){super.onActivityResult(r,c,d);if(c!=RESULT_OK||d==null)return;try{if(r==REQ_BACKUP)'
          new='@Override protected void onActivityResult(int r,int c,Intent d){super.onActivityResult(r,c,d);if(r==REQ_GOOGLE){try{GoogleSignInAccount account=GoogleSignIn.getSignedInAccountFromIntent(d).getResult(ApiException.class);if(account==null||account.getIdToken()==null){showGoogleError("Não foi possível obter a conta Google.");return;}AuthCredential fc=GoogleAuthProvider.getCredential(account.getIdToken(),null);FirebaseAuth.getInstance().signInWithCredential(fc).addOnSuccessListener(v->{runOnUiThread(()->{Toast.makeText(this,"Google conectado. Sincronização ativada.",Toast.LENGTH_LONG).show();recreate();});}).addOnFailureListener(e->showGoogleError("Google não autorizou a conexão. Verifique a conta."));}catch(Exception e){showGoogleError("Não foi possível concluir a conexão Google.");}return;}if(c!=RESULT_OK||d==null)return;try{if(r==REQ_BACKUP)'
          s=s.replace(old,new)
          marker='    static class Tx {String id="",type="out",category="Mercado",date="",desc="";double amount=0;}'
          helper='    private void showGoogleError(String s){Toast.makeText(this,s,Toast.LENGTH_LONG).show();}\n\n'
          s=s.replace(marker,helper+marker)
          start=s.index('        static void signIn(Activity a){')
          end=s.index('        private static void show',start)
          method='''        static void signIn(Activity a){init(a);if(auth==null){show(a,"Não foi possível preparar o Google.");return;}try{GoogleSignInOptions gso=new GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN).requestIdToken(WEB_CLIENT_ID).requestEmail().build();Intent i=GoogleSignIn.getClient(a,gso).getSignInIntent();a.startActivityForResult(i,REQ_GOOGLE);}catch(Exception e){show(a,"Não foi possível abrir as contas Google.");}}\n'''
          s=s[:start]+method+s[end:]
          p.write_text(s)
          PY
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Gerar APKs instaláveis assinados
        run: gradle :app:assembleDebug :financeiro:assembleDebug --no-daemon
      - name: Conferir APKs gerados
        run: |
          find app/build/outputs/apk/debug -maxdepth 1 -type f -print
          find financeiro/build/outputs/apk/debug -maxdepth 1 -type f -print
          jarsigner -verify -verbose -certs app/build/outputs/apk/debug/app-debug.apk | tail -5
          jarsigner -verify -verbose -certs financeiro/build/outputs/apk/debug/financeiro-debug.apk | tail -5
      - name: Preparar downloads diretos e versão web
        run: |
          rm -rf public
          mkdir -p public
          cp app/build/outputs/apk/debug/app-debug.apk public/ComidaDeVo-Clientes.apk
          cp financeiro/build/outputs/apk/debug/financeiro-debug.apk public/ComidaDeVo-Financeiro.apk
          cp ../clientes.html public/clientes.html
          cp ../google-sync.js public/google-sync.js
          cp ../manifest-clientes.json public/manifest-clientes.json
          cp ../sw-clientes.js public/sw-clientes.js
          printf '%s\n' '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comida de Vó</title></head><body><h1>Comida de Vó</h1><p><a href="clientes.html">Abrir Clientes</a></p><p><a href="ComidaDeVo-Clientes.apk">Baixar Clientes</a></p><p><a href="ComidaDeVo-Financeiro.apk">Baixar Financeiro</a></p></body></html>' > public/index.html
      - name: Publicar APKs e versão web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./android/public
          force_orphan: true
      - name: Publicar APKs como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: comida-de-vo-apks-instalaveis
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/financeiro/build/outputs/apk/debug/financeiro-debug.apk
          if-no-files-found: error
