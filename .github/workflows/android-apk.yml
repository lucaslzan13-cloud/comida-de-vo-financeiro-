name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Gerar APK instalável assinado
        run: gradle assembleDebug --no-daemon
      - name: Conferir APK gerado
        run: find app/build/outputs/apk/debug -maxdepth 1 -type f -print
      - name: Preparar download direto
        run: |
          rm -rf public
          mkdir -p public
          cp app/build/outputs/apk/debug/app-debug.apk public/ComidaDeVo-Clientes.apk
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comida de Vó</title></head><body><h1>Comida de Vó</h1><p><a href="ComidaDeVo-Clientes.apk">Baixar aplicativo Clientes</a></p></body></html>' > public/index.html
      - name: Publicar APK em link direto
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./android/public
          force_orphan: true
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: comida-de-vo-clientes-apk-instalavel
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
