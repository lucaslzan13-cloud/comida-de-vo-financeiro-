<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Controle financeiro rápido da Comida de Vó">
<link rel="manifest" href="manifest.json">
<title>Comida de Vó — Financeiro</title>
<style>
*{box-sizing:border-box}html{background:#f3f4f6}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f3f4f6;color:#111827;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{touch-action:manipulation}
header{background:#111827;color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 20px;position:sticky;top:0;z-index:10}h1{margin:0;font-size:23px;line-height:1.15}.sub{opacity:.7;font-size:13px;margin-top:4px}
main{max-width:720px;margin:auto;padding:12px 12px 90px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.card{background:#fff;border-radius:16px;padding:13px;box-shadow:0 2px 10px #0000000d}.card.balance{grid-column:1/-1}.label{font-size:12px;color:#6b7280}.value{font-size:22px;font-weight:850;margin-top:4px}.in{color:#15803d}.out{color:#b91c1c}.bal{color:#1d4ed8}
.quick{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}.quick-title{font-size:17px;font-weight:800;margin-bottom:10px}.type-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.type-btn{padding:11px;border-radius:12px;border:1px solid #d1d5db;background:#f9fafb;color:#374151;font-weight:800}.type-btn.active.out-type{background:#111827;color:#fff;border-color:#111827}.type-btn.active.in-type{background:#15803d;color:#fff;border-color:#15803d}
.amount-wrap{position:relative}.amount{width:100%;padding:15px 48px 15px 15px;border:2px solid #d1d5db;border-radius:14px;background:#fff;font-size:30px;font-weight:800;outline:none}.amount:focus{border-color:#111827}.currency{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-weight:800;color:#6b7280}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{width:auto;padding:9px 12px;border:1px solid #d1d5db;border-radius:999px;background:#fff;color:#374151;font-weight:700}.chip.selected{background:#111827;color:#fff;border-color:#111827}.more-cat{background:#f3f4f6}
.save{margin-top:11px;width:100%;padding:14px;border:0;border-radius:13px;background:#111827;color:#fff;font-size:17px;font-weight:850}.save:active{transform:scale(.99)}.hint{text-align:center;font-size:11px;color:#6b7280;margin-top:7px}
.details{margin-top:10px}.details summary{cursor:pointer;color:#4b5563;font-size:13px;font-weight:700;padding:4px 0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}.detail-grid>div{min-width:0}label{font-size:11px;color:#6b7280;display:block;margin:0 0 4px 2px}input[type=date],.desc{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;background:#fff;outline:none}.desc{grid-column:1/-1}
.last{margin-top:10px;border-top:1px solid #eee;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.last-text{font-size:12px;color:#6b7280}.repeat{width:auto;padding:8px 10px;background:#e5e7eb;color:#111827;border:0;border-radius:10px;font-size:12px;font-weight:800}
section{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}h2{font-size:16px;margin:0 0 10px}.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}select,input[type=month]{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;background:#fff}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.item strong{display:block}.meta{font-size:11px;color:#6b7280;margin-top:3px}.amt{font-weight:850;white-space:nowrap;text-align:right}.delete{padding:4px 7px;margin-top:4px;font-size:10px;border:0;border-radius:8px;background:#fee2e2;color:#991b1b}.empty{text-align:center;color:#6b7280;padding:18px 8px;font-size:13px}.bottom-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.secondary{width:100%;padding:11px;border:0;border-radius:11px;background:#e5e7eb;color:#111827;font-weight:750}.danger{background:#fee2e2;color:#991b1b}.install{display:none;width:100%;margin-top:9px;padding:11px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:800}.status{font-size:11px;text-align:center;color:#6b7280;margin-top:9px}.status.ok{color:#15803d}.status.warn{color:#b45309}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){.cards{grid-template-columns:repeat(3,1fr)}.card.balance{grid-column:auto}}
</style>
</head>
<body>
<header><h1>Comida de Vó</h1><div class="sub">Controle financeiro</div></header>
<main>
<div class="cards"><div class="card"><div class="label">Entradas</div><div id="totalIn" class="value in">R$ 0,00</div></div><div class="card"><div class="label">Gastos</div><div id="totalOut" class="value out">R$ 0,00</div></div><div class="card balance"><div class="label">Saldo do mês</div><div id="balance" class="value bal">R$ 0,00</div></div></div>
<div class="quick">
<div class="quick-title">Lançamento rápido</div>
<div class="type-row"><button id="outBtn" class="type-btn active out-type" onclick="setType('out')">Gasto</button><button id="inBtn" class="type-btn in-type" onclick="setType('in')">Entrada</button></div>
<div class="amount-wrap"><input id="amount" class="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" enterkeyhint="done"><span class="currency">R$</span></div>
<div id="chips" class="chips"></div>
<button class="save" onclick="add()">Salvar lançamento</button><div class="hint">Valor → categoria → salvar. Enter também salva.</div>
<details class="details"><summary>Mais opções</summary><div class="detail-grid"><div><label>Data</label><input id="date" type="date"></div><div><label>Categoria escolhida</label><select id="categorySelect" onchange="selectCategory(this.value)"></select></div><input id="desc" class="desc" placeholder="Descrição (opcional)" autocomplete="off"></div></details>
<div id="lastBox" class="last" hidden><div id="lastText" class="last-text"></div><button class="repeat" onclick="repeatLast()">Repetir</button></div>
<button id="install" class="install" onclick="installApp()">Instalar aplicativo</button><div id="status" class="status">Carregando dados…</div>
</div>
<section><h2>Filtros</h2><div class="filter-grid"><div><label>Mês</label><input id="month" type="month" onchange="render()"></div><div><label>Tipo</label><select id="filterType" onchange="render()"><option value="all">Todos</option><option value="in">Entradas</option><option value="out">Gastos</option></select></div></div></section>
<section><h2>Histórico</h2><div id="list"></div><div class="bottom-actions"><button class="secondary danger" onclick="clearAll()">Apagar todos</button><button class="secondary" onclick="exportData()">Backup dos dados</button><button class="secondary" onclick="document.getElementById('importFile').click()">Restaurar backup</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(this.files[0])"></div></section>
</main><div id="toast" class="toast"></div>
<script>
const KEY='cdv_financeiro_v2',DB_NAME='cdv_financeiro_db',DB_VERSION=1,STORE='state',CATS=['Mercado','Açougue','Embalagens','Funcionários','Motoboy','Contas','Água','Luz','Internet','Combustível','Publicidade','iFood/Taxas','Equipamentos','Outros'];
let data=[],currentType='out',currentCategory='Mercado',deferredPrompt=null,db=null;
const byId=id=>document.getElementById(id),brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),today=()=>new Date().toISOString().slice(0,10);
function showToast(text){const t=byId('toast');t.textContent=text;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1400)}
function setStatus(text,kind=''){const e=byId('status');e.textContent=text;e.className='status '+kind}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbGet(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).get('app');r.onsuccess=()=>resolve(r.result?.data||null);r.onerror=()=>reject(r.error)})}
function dbPut(value){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({id:'app',data:value,updatedAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function persist(){try{if(db)await dbPut(data);localStorage.setItem(KEY,JSON.stringify(data));setStatus('Dados salvos com segurança','ok')}catch(e){try{localStorage.setItem(KEY,JSON.stringify(data));setStatus('Salvo no armazenamento do aparelho','warn')}catch(_){setStatus('Não foi possível salvar','warn');throw e}}render()}
async function boot(){try{db=await openDB();const saved=await dbGet();if(Array.isArray(saved)){data=saved}else{let old=null;try{old=JSON.parse(localStorage.getItem('cdv_financeiro_v1')||localStorage.getItem(KEY)||'null')}catch(_){}data=Array.isArray(old)?old:[];await dbPut(data);localStorage.setItem(KEY,JSON.stringify(data))}if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});setStatus('Dados salvos neste aparelho','ok')}catch(e){try{const old=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('cdv_financeiro_v1')||'[]');data=Array.isArray(old)?old:[]}catch(_){data=[]}setStatus('Modo de segurança: armazenamento local','warn')}render()}
function setType(type){currentType=type;byId('outBtn').classList.toggle('active',type==='out');byId('inBtn').classList.toggle('active',type==='in')}
function recentCats(){const counts={};data.forEach(x=>{counts[x.category]=(counts[x.category]||0)+1});return CATS.slice().sort((a,b)=>(counts[b]||0)-(counts[a]||0)).slice(0,8)}
function renderCats(){const cats=recentCats();byId('chips').innerHTML=cats.map(c=>`<button class="chip ${c===currentCategory?'selected':''}" onclick="selectCategory('${escAttr(c)}')">${esc(c)}</button>`).join('')+`<button class="chip more-cat" onclick="showAllCats()">Mais</button>`;byId('categorySelect').innerHTML=CATS.map(c=>`<option value="${escAttr(c)}" ${c===currentCategory?'selected':''}>${esc(c)}</option>`).join('')}
function showAllCats(){byId('categorySelect').closest('details').open=true;byId('categorySelect').focus()}
function selectCategory(cat){if(!CATS.includes(cat))cat='Outros';currentCategory=cat;byId('categorySelect').value=cat;renderCats()}
function parseAmount(v){let s=String(v).trim().replace(/R\$\s?/gi,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Number(s)||0}
async function add(){const amount=parseAmount(byId('amount').value),date=byId('date').value||today(),desc=byId('desc').value.trim();if(!amount||amount<=0){byId('amount').focus();showToast('Digite o valor');return}const item={id:crypto.randomUUID(),type:currentType,amount,category:currentCategory,date,desc:desc||currentCategory,createdAt:Date.now()};data.unshift(item);await persist();byId('amount').value='';byId('desc').value='';byId('date').value=today();byId('lastBox').hidden=false;byId('lastText').textContent=`Último: ${brl(item.amount)} · ${item.category}`;showToast(currentType==='out'?'Gasto salvo':'Entrada salva');byId('amount').focus()}
function repeatLast(){const x=data[0];if(!x)return;setType(x.type);currentCategory=x.category;byId('amount').value=String(x.amount).replace('.',',');byId('desc').value=x.desc===x.category?'':x.desc;byId('date').value=today();renderCats();byId('amount').focus()}
function filtered(){const m=byId('month').value,t=byId('filterType').value;return data.filter(x=>(!m||String(x.date).startsWith(m))&&(t==='all'||x.type===t)).sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.createdAt||b.id)-Number(a.createdAt||a.id))}
function render(){const rows=filtered(),tin=rows.filter(x=>x.type==='in').reduce((s,x)=>s+Number(x.amount),0),tout=rows.filter(x=>x.type==='out').reduce((s,x)=>s+Number(x.amount),0);byId('totalIn').textContent=brl(tin);byId('totalOut').textContent=brl(tout);byId('balance').textContent=brl(tin-tout);const el=byId('list');if(!rows.length)el.innerHTML='<div class="empty">Nenhum lançamento neste período.</div>';else el.innerHTML=rows.map(x=>`<div class="item"><div><strong>${esc(x.desc)}</strong><div class="meta">${String(x.date).split('-').reverse().join('/')} · ${esc(x.category)}</div></div><div class="amt ${x.type==='in'?'in':'out'}">${x.type==='in'?'+':'−'} ${brl(x.amount)}<br><button class="delete" onclick="del('${x.id}')">Excluir</button></div></div>`).join('');renderCats()}
async function del(id){const item=data.find(x=>String(x.id)===String(id));if(!item||!confirm('Excluir este lançamento?'))return;data=data.filter(x=>String(x.id)!==String(id));await persist();showToast('Lançamento excluído')}
async function clearAll(){if(!data.length)return;if(confirm('Apagar TODOS os lançamentos? Esta ação não pode ser desfeita.')){data=[];await persist();showToast('Lançamentos apagados')}}
async function exportData(){const payload={version:3,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='comida-de-vo-financeiro-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('Backup exportado')}
async function importData(file){if(!file)return;try{const x=JSON.parse(await file.text()),incoming=Array.isArray(x)?x:x.data;if(!Array.isArray(incoming))throw new Error('invalid');if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;data=incoming.map(x=>({...x,id:x.id||crypto.randomUUID(),createdAt:x.createdAt||Date.now()}));await persist();showToast('Backup restaurado')}catch(e){showToast('Backup inválido')}}
function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}
window.__cdvFinanceSetData=function(next){if(!Array.isArray(next))return;data=next;try{localStorage.setItem(KEY,JSON.stringify(data));if(db)dbPut(data).catch(()=>{})}catch(_){}render()};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;byId('install').style.display='block'});async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;byId('install').style.display='none'}
byId('amount').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});if(location.search.includes('quick=in'))setType('in');
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(reg=>{reg.update().catch(()=>{});if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller&&reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'})})})}).catch(()=>{})}
byId('date').value=today();byId('month').value=today().slice(0,7);boot();byId('amount').focus();
</script>
<script type="module" src="finance-google-sync.js"></script>
</body>
</html>
