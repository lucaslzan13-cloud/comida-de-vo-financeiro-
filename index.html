<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Controle financeiro da Comida de Vó">
<link rel="manifest" href="manifest.json">
<title>Comida de Vó — Financeiro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:20px 16px 24px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px}.sub{opacity:.75;font-size:13px;margin-top:4px}
main{max-width:720px;margin:auto;padding:14px 14px 90px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0000000d}.label{font-size:12px;color:#6b7280}.value{font-size:22px;font-weight:800;margin-top:5px}
.in{color:#15803d}.out{color:#b91c1c}.bal{color:#1d4ed8}
section{background:#fff;border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:#4b5563;display:block;margin-bottom:5px}input,select,button{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;font:inherit;background:#fff}
button{border:0;background:#111827;color:#fff;font-weight:700;cursor:pointer}.danger{background:#fee2e2;color:#991b1b}.secondary{background:#e5e7eb;color:#111827}
.full{grid-column:1/-1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
.item strong{display:block}.meta{font-size:12px;color:#6b7280;margin-top:3px}.amt{font-weight:800;white-space:nowrap}
.empty{text-align:center;color:#6b7280;padding:20px}.install{display:none;margin-top:10px;background:#2563eb}
@media(min-width:600px){.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><h1>Comida de Vó</h1><div class="sub">Controle financeiro</div></header>
<main>
<div class="cards">
<div class="card"><div class="label">Entradas</div><div id="totalIn" class="value in">R$ 0,00</div></div>
<div class="card"><div class="label">Gastos</div><div id="totalOut" class="value out">R$ 0,00</div></div>
<div class="card"><div class="label">Saldo</div><div id="balance" class="value bal">R$ 0,00</div></div>
</div>

<section>
<h2>Novo lançamento</h2>
<div class="grid">
<div><label>Tipo</label><select id="type"><option value="out">Gasto</option><option value="in">Entrada</option></select></div>
<div><label>Valor (R$)</label><input id="amount" type="number" inputmode="decimal" step="0.01" placeholder="0,00"></div>
<div><label>Categoria</label><select id="category">
<option>Ingredientes</option><option>Embalagens</option><option>Funcionários</option><option>Motoboy</option><option>Combustível</option><option>Publicidade</option><option>iFood/Taxas</option><option>Equipamentos</option><option>Contas</option><option>Fornecedor</option><option>Vendas</option><option>Outros</option>
</select></div>
<div><label>Data</label><input id="date" type="date"></div>
<div class="full"><label>Descrição</label><input id="desc" placeholder="Ex.: compra de arroz"></div>
</div>
<div class="actions"><button onclick="add()">Adicionar</button><button class="secondary" onclick="clearForm()">Limpar</button></div>
<button id="install" class="install" onclick="installApp()">Instalar aplicativo</button>
</section>

<section>
<h2>Filtros</h2>
<div class="grid">
<div><label>Mês</label><input id="month" type="month" onchange="render()"></div>
<div><label>Tipo</label><select id="filterType" onchange="render()"><option value="all">Todos</option><option value="in">Entradas</option><option value="out">Gastos</option></select></div>
</div>
</section>

<section>
<h2>Histórico</h2>
<div id="list"></div>
<div class="actions"><button class="danger" onclick="clearAll()">Apagar todos</button><button class="secondary" onclick="exportData()">Exportar dados</button></div>
</section>
</main>
<script>
const KEY='cdv_financeiro_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
let deferredPrompt=null;
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
document.getElementById('date').value=new Date().toISOString().slice(0,10);
document.getElementById('month').value=new Date().toISOString().slice(0,7);

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install').style.display='block'});
async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt=null}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function add(){
 const type=document.getElementById('type').value, amount=Number(document.getElementById('amount').value);
 const category=document.getElementById('category').value, date=document.getElementById('date').value, desc=document.getElementById('desc').value.trim();
 if(!amount||amount<=0||!date){alert('Informe valor e data.');return}
 data.unshift({id:Date.now(),type,amount,category,date,desc:desc||category});save();clearForm();
}
function clearForm(){document.getElementById('amount').value='';document.getElementById('desc').value=''}
function filtered(){
 const m=document.getElementById('month').value,t=document.getElementById('filterType').value;
 return data.filter(x=>(!m||x.date.startsWith(m))&&(t==='all'||x.type===t)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)
}
function render(){
 const rows=filtered(), tin=rows.filter(x=>x.type==='in').reduce((s,x)=>s+x.amount,0), tout=rows.filter(x=>x.type==='out').reduce((s,x)=>s+x.amount,0);
 document.getElementById('totalIn').textContent=brl(tin);document.getElementById('totalOut').textContent=brl(tout);document.getElementById('balance').textContent=brl(tin-tout);
 const el=document.getElementById('list');
 if(!rows.length){el.innerHTML='<div class="empty">Nenhum lançamento neste período.</div>';return}
 el.innerHTML=rows.map(x=>`<div class="item"><div><strong>${esc(x.desc)}</strong><div class="meta">${x.date.split('-').reverse().join('/')} · ${esc(x.category)}</div></div><div class="amt ${x.type==='in'?'in':'out'}">${x.type==='in'?'+':'−'} ${brl(x.amount)}<br><button style="padding:5px 8px;margin-top:5px;font-size:11px" onclick="del(${x.id})">Excluir</button></div></div>`).join('');
}
function del(id){if(confirm('Excluir este lançamento?')){data=data.filter(x=>x.id!==id);save()}}
function clearAll(){if(confirm('Apagar TODOS os lançamentos?')){data=[];save()}}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='comida-de-vo-financeiro.json';a.click();URL.revokeObjectURL(a.href)}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
