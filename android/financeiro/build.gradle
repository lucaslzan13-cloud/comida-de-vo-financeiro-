plugins { id 'com.android.application' }

android {
    namespace 'br.com.comidadevo.financeiro'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.comidadevo.financeiro'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
}

tasks.register('syncFinanceiroWeb', Copy) {
    from(rootProject.projectDir.parentFile) {
        include('index.html')
        include('manifest.json')
        include('sw.js')
        include('finance-google-sync.js')
    }
    into(layout.projectDirectory.dir('src/main/assets'))
    rename('index.html', 'index.html')
    doLast {
        def page = layout.projectDirectory.file('src/main/assets/index.html').asFile
        def html = page.getText('UTF-8')
        if (!html.contains('finance-google-sync.js')) {
            html = html.replace('</body>', '<script type="module" src="finance-google-sync.js"></script>\n</body>')
            page.setText(html, 'UTF-8')
        }
    }
}

tasks.named('preBuild').configure { dependsOn('syncFinanceiroWeb') }
