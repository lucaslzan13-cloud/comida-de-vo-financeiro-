plugins { id 'com.android.application' }

android {
    namespace 'br.com.comidadevo.financeiro'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.comidadevo.financeiro'
        minSdk 24
        targetSdk 36
        versionCode 25
        versionName '4.0'
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/comida-de-vo-debug.keystore')
            storePassword 'comidadevo'
            keyAlias 'comidadevo'
            keyPassword 'comidadevo'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false; shrinkResources false }
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation platform('com.google.firebase:firebase-bom:35.0.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}

tasks.withType(JavaCompile).configureEach {
    doFirst {
        def f = file('src/main/java/br/com/comidadevo/financeiro/MainActivity.java')
        def s = f.getText('UTF-8')
        if (!s.contains('class GoogleSync40')) {
            s = s.replace('import android.content.*;', 'import android.content.*;\nimport android.os.CancellationSignal;\nimport androidx.annotation.NonNull;\nimport androidx.credentials.Credential;\nimport androidx.credentials.CredentialManager;\nimport androidx.credentials.CredentialManagerCallback;\nimport androidx.credentials.CustomCredential;\nimport androidx.credentials.GetCredentialRequest;\nimport androidx.credentials.GetCredentialResponse;\nimport androidx.credentials.exceptions.GetCredentialException;\nimport com.google.android.libraries.identity.googleid.GetGoogleIdOption;\nimport com.google.android.libraries.identity.googleid.GoogleIdTokenCredential;\nimport com.google.android.libraries.identity.googleid.GoogleIdTokenParsingException;\nimport com.google.firebase.FirebaseApp;\nimport com.google.firebase.FirebaseOptions;\nimport com.google.firebase.auth.AuthCredential;\nimport com.google.firebase.auth.FirebaseAuth;\nimport com.google.firebase.auth.FirebaseUser;\nimport com.google.firebase.auth.GoogleAuthProvider;\nimport com.google.firebase.firestore.FirebaseFirestore;\nimport java.util.HashMap;\nimport java.util.Map;\nimport java.util.concurrent.Executors;')
            s = s.replace('private static final int REQ_RESTORE=9001, REQ_BACKUP=9002;', 'private static final int REQ_RESTORE=9001, REQ_BACKUP=9002;')
            s = s.replace('prefs=getSharedPreferences("financeiro_native",MODE_PRIVATE); load(); date=today(); build();', 'prefs=getSharedPreferences("financeiro_native",MODE_PRIVATE); load(); date=today(); GoogleSync40.init(this); build(); GoogleSync40.pull(this);')
            s = s.replace('if(!AutoDrive371.connected(this)){ TextView backup=action("Conectar conta Google",15);backup.setTextColor(Color.WHITE);backup.setBackground(bg(NAVY,14,0));backup.setOnClickListener(v->AutoDrive371.setup(this));tools.addView(backup);margin(backup,6,0); }', 'if(!GoogleSync40.connected()){ TextView backup=action("Conectar conta Google",15);backup.setTextColor(Color.WHITE);backup.setBackground(bg(NAVY,14,0));backup.setOnClickListener(v->GoogleSync40.signIn(this));tools.addView(backup);margin(backup,6,0); }')
            s = s.replace('persist();AutoDrive371.sync(this,dataJson());clearForm();refresh();', 'persist();GoogleSync40.push(this,dataJson());clearForm();refresh();')
            s = s.replace('data.remove(x);persist();AutoDrive371.sync(this,dataJson());refresh();', 'data.remove(x);persist();GoogleSync40.push(this,dataJson());refresh();')
            int last = s.lastIndexOf('}')
            def helper = '''
    static class GoogleSync40 {
        private static final String WEB_CLIENT_ID="684260435515-ijo5egmulann3o6hl2u79400cv09h1sl.apps.googleusercontent.com";
        private static final String API_KEY="AIzaSyBne-T-nOC6oLYc96jhd-tpYQxja8lNhG4";
        private static final String APP_ID="1:684260435515:web:b67441528fde0229fc5e1e";
        private static final String PROJECT_ID="symmetric-curve-475011-h8";
        private static final String BUCKET="symmetric-curve-475011-h8.firebasestorage.app";
        private static FirebaseAuth auth; private static FirebaseFirestore db; private static boolean started=false;
        static void init(Activity a){
            try{
                if(FirebaseApp.getApps(a).isEmpty()){
                    FirebaseOptions o=new FirebaseOptions.Builder().setApiKey(API_KEY).setApplicationId(APP_ID).setProjectId(PROJECT_ID).setStorageBucket(BUCKET).build();
                    FirebaseApp.initializeApp(a,o);
                }
                auth=FirebaseAuth.getInstance(); db=FirebaseFirestore.getInstance();
                if(!started){
                    started=true;
                    auth.addAuthStateListener(x->{
                        if(x.getCurrentUser()!=null) pull(a);
                        a.runOnUiThread(()->((MainActivity)a).build());
                    });
                    db.collection("users").document("__unused__");
                }
            }catch(Exception e){Toast.makeText(a,"Não foi possível preparar a conexão Google.",Toast.LENGTH_LONG).show();}
        }
        static boolean connected(){return auth!=null&&auth.getCurrentUser()!=null;}
        static void signIn(Activity a){
            if(auth==null)init(a);
            try{
                CredentialManager cm=CredentialManager.create(a);
                GetGoogleIdOption opt=new GetGoogleIdOption.Builder().setFilterByAuthorizedAccounts(false).setAutoSelectEnabled(false).setServerClientId(WEB_CLIENT_ID).build();
                GetCredentialRequest req=new GetCredentialRequest.Builder().addCredentialOption(opt).build();
                cm.getCredentialAsync(a,req,new CancellationSignal(),Executors.newSingleThreadExecutor(),new CredentialManagerCallback<GetCredentialResponse,GetCredentialException>(){
                    @Override public void onResult(@NonNull GetCredentialResponse r){
                        Credential c=r.getCredential();
                        if(c instanceof CustomCredential && GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL.equals(c.getType())){
                            try{
                                GoogleIdTokenCredential g=GoogleIdTokenCredential.createFrom(((CustomCredential)c).getData());
                                AuthCredential fc=GoogleAuthProvider.getCredential(g.getIdToken(),null);
                                auth.signInWithCredential(fc).addOnSuccessListener(v->{Toast.makeText(a,"Google conectado. Sincronização automática ativada.",Toast.LENGTH_LONG).show();pull(a);a.runOnUiThread(()->((MainActivity)a).build());}).addOnFailureListener(e->Toast.makeText(a,"Não foi possível conectar ao Google.",Toast.LENGTH_LONG).show());
                            }catch(GoogleIdTokenParsingException e){Toast.makeText(a,"Não foi possível ler a conta Google.",Toast.LENGTH_LONG).show();}
                        }else Toast.makeText(a,"Nenhuma conta Google foi selecionada.",Toast.LENGTH_SHORT).show();
                    }
                    @Override public void onError(@NonNull GetCredentialException e){Toast.makeText(a,"Não foi possível abrir a seleção da conta Google.",Toast.LENGTH_LONG).show();}
                });
            }catch(Exception e){Toast.makeText(a,"Não foi possível iniciar o Google.",Toast.LENGTH_LONG).show();}
        }
        static void push(Activity a,JSONArray data){
            if(!connected()||db==null)return;
            FirebaseUser u=auth.getCurrentUser(); if(u==null)return;
            HashMap<String,Object> payload=new HashMap<>();payload.put("state",data.toString());payload.put("email",u.getEmail());payload.put("updatedAt",System.currentTimeMillis());
            db.collection("users").document(u.getUid()).set(payload,com.google.firebase.firestore.SetOptions.merge());
        }
        static void pull(Activity a){
            if(!connected()||db==null)return;
            FirebaseUser u=auth.getCurrentUser();if(u==null)return;
            db.collection("users").document(u.getUid()).get().addOnSuccessListener(snap->{
                if(!snap.exists())return;
                Object raw=snap.get("state");if(!(raw instanceof String))return;
                try{JSONArray remote=new JSONArray((String)raw);MainActivity m=(MainActivity)a;m.data.clear();for(int i=0;i<remote.length();i++){JSONObject o=remote.getJSONObject(i);Tx x=new Tx();x.id=o.optString("id",UUID.randomUUID().toString());x.type=o.optString("type","out");x.amount=o.optDouble("amount",0);x.category=o.optString("category","");x.date=o.optString("date","");x.desc=o.optString("desc","");m.data.add(x);}m.persist();a.runOnUiThread(m::refresh);}catch(Exception ignored){}
            });
        }
    }
    // AUTO_GOOGLE_FIREBASE_40
'''
            s = s.substring(0,last) + helper + s.substring(last)
            f.setText(s,'UTF-8')
        }
    }
}
