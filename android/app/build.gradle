plugins { id 'com.android.application' }

android {
    namespace 'br.com.comidadevo.clientes'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.comidadevo.clientes'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/comida-de-vo-debug.keystore')
            storePassword 'comidadevo'
            keyAlias 'comidadevo'
            keyPassword 'comidadevo'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}

tasks.register('syncClientesWeb', Copy) {
    from(rootProject.projectDir.parentFile) {
        include('clientes.html')
        include('manifest-clientes.json')
        include('sw-clientes.js')
        include('google-sync.js')
    }
    into(layout.projectDirectory.dir('src/main/assets'))
    rename('clientes.html', 'index.html')
}

tasks.register('injectClientesSync') {
    dependsOn('syncClientesWeb')
    doLast {
        def f = file('src/main/assets/index.html')
        def html = f.getText('UTF-8')
        if (!html.contains('google-sync.js')) {
            html = html.replace('</head>', '<script type="module" src="google-sync.js"></script></head>')
            f.write(html, 'UTF-8')
        }
    }
}

tasks.named('preBuild').configure { dependsOn('injectClientesSync') }
