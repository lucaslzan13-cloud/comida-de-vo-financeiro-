plugins { id 'com.android.application' }

android {
    namespace 'br.com.comidadevo.clientes'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.comidadevo.clientes'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

tasks.register('syncClientesWeb', Copy) {
    from(rootProject.projectDir.parentFile) {
        include('clientes.html')
        include('manifest-clientes.json')
        include('sw-clientes.js')
    }
    into(layout.projectDirectory.dir('src/main/assets'))
    rename('clientes.html', 'index.html')
}

tasks.named('preBuild').configure { dependsOn('syncClientesWeb') }
