<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Comida de Vó — Clientes</title></head><body><div style="font-family:system-ui;text-align:center;padding:40px">Carregando Clientes…</div><script>(async()=>{try{const u='https://raw.githubusercontent.com/lucaslzan13-cloud/comida-de-vo-financeiro-/4c72073b653c0bc271b14cc1a134c8997bf6b112/clientes/index.html?v=20261014-1522';let h=await (await fetch(u,{cache:'no-store'})).text();h=h.replace("import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';","import { getAuth, GoogleAuthProvider, linkWithRedirect, signInWithRedirect, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';");const gate=`<style>#googleGate{position:fixed;inset:0;background:#111827ee;display:flex;align-items:center;justify-content:center;padding:22px;z-index:9999}#googleGate .box{background:#fff;border-radius:22px;padding:28px 22px;text-align:center;max-width:390px;width:100%;box-shadow:0 15px 50px #0005}#googleGate h2{margin:0 0 8px;font-size:25px;color:#111827}#googleGate p{margin:0 0 20px;color:#6b7280;font-size:14px;line-height:1.45}#googleLogin{width:100%;border:0;border-radius:12px;padding:14px;background:#111827;color:#fff;font-weight:800;font-size:16px}#googleMsg{font-size:12px;color:#b91c1c;margin-top:10px;line-height:1.4}</style><div id="googleGate"><div class="box"><h2>Comida de Vó</h2><p>Primeiro acesso? Conecte este aparelho à conta Google da Comida de Vó. Depois disso, o login ficará salvo neste celular.</p><button id="googleLogin">Entrar com Google</button><div id="googleMsg"></div></div></div>`;h=h.replace('</body>',gate+'</body>');const old="async function startCloud(){try{await signInAnonymously(auth)}catch(e){console.error(e);status('Ative o login anônimo no Firebase para sincronizar','warn');return}onAuthStateChanged(auth,async user=>{if(!user)return;cloudReady=true;try{await migrateCache()}catch(e){console.error(e)}attachCloud()})}";const neu="async function startCloud(){const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});const gate=document.getElementById('googleGate'),btn=document.getElementById('googleLogin'),msg=document.getElementById('googleMsg');const finish=async()=>{if(gate)gate.style.display='none';cloudReady=true;try{await migrateCache()}catch(e){console.error(e)}attachCloud()};onAuthStateChanged(auth,async user=>{if(!user||user.isAnonymous){if(gate)gate.style.display='flex';return}await finish()});btn.onclick=async()=>{btn.disabled=true;btn.textContent='Abrindo Google…';msg.textContent='';try{const current=auth.currentUser;if(current&&current.isAnonymous){await linkWithRedirect(current,provider)}else{await signInWithRedirect(auth,provider)}}catch(e){console.error('Google Auth:',e);const code=e&&e.code?e.code:'';if(code==='auth/unauthorized-domain'){msg.textContent='O endereço deste aplicativo ainda não está autorizado no Firebase. É só liberar o domínio do aplicativo no Firebase.'}else if(code==='auth/popup-blocked'){msg.textContent='O navegador bloqueou a janela do Google. Tente tocar novamente.'}else{msg.textContent='Não foi possível abrir o Google ('+(code||'erro de autenticação')+'). Tente novamente.'}btn.disabled=false;btn.textContent='Entrar com Google'}}}";if(!h.includes(old))throw new Error('Bloco de autenticação não encontrado');h=h.replace(old,neu);document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="font-family:system-ui;text-align:center;padding:40px">Não foi possível carregar o aplicativo. Verifique a internet e tente novamente.</div>';console.error(e)}})();</script></body></html>
