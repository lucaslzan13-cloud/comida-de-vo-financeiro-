<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest-clientes.json"><title>Comida de Vó — Clientes Fixos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}button,input{font:inherit}button{touch-action:manipulation}header{background:#111827;color:#fff;padding:20px 16px 22px;position:sticky;top:0;z-index:10}h1{margin:0;font-size:24px}.sub{opacity:.7;margin-top:4px;font-size:13px}main{max-width:760px;margin:auto;padding:12px 12px 80px}.top{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.stat,section{background:#fff;border-radius:18px;padding:15px;box-shadow:0 2px 10px #0001}.stat small{color:#6b7280}.stat b{display:block;font-size:24px;margin-top:3px}.green{color:#15803d}.red{color:#b91c1c}.blue{color:#1d4ed8}section{margin-bottom:12px}h2{font-size:18px;margin:0 0 12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.date{font-size:12px;color:#6b7280;margin-top:-7px;margin-bottom:12px}.add,.primary{border:0;background:#111827;color:#fff;border-radius:11px;padding:10px 13px;font-weight:800}.search{width:100%;padding:12px 13px;border:1px solid #d1d5db;border-radius:12px;background:#fff;margin-bottom:10px;outline:none}.search:focus{border-color:#111827}.client{border:1px solid #e5e7eb;border-radius:15px;padding:13px;margin-bottom:9px}.client:last-child{margin-bottom:0}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:850}.price{font-size:12px;color:#6b7280;margin-top:2px}.balance{font-weight:900;font-size:17px;text-align:right}.credit{color:#15803d}.debt{color:#b91c1c}.extra{font-size:12px;color:#6b7280;margin:9px 0 10px}.take{width:100%;border:0;background:#111827;color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:850}.take:active,.add:active,.primary:active{transform:scale(.99)}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.mini,.secondary{border:0;background:#f3f4f6;border-radius:9px;padding:9px;font-size:12px;font-weight:750}.danger{background:#fee2e2;color:#991b1b}.empty{text-align:center;color:#6b7280;padding:20px}.history{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.history:last-child{border-bottom:0}.meta{font-size:11px;color:#6b7280;margin-top:3px}.qty{font-weight:850}.out{color:#b91c1c}.in{color:#15803d}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:30}.modal.open{display:flex}.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 15px 24px;max-height:92vh;overflow:auto}.sheet h3{margin:0 0 5px;font-size:21px}.sheet p{margin:0 0 14px;color:#6b7280;font-size:13px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}.choice{padding:12px 4px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-weight:850}.choice.active{background:#111827;color:#fff}.big{width:100%;padding:13px;text-align:center;font-size:30px;font-weight:850;border:1px solid #d1d5db;border-radius:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}label{font-size:11px;color:#6b7280;display:block;margin:0 0 4px 2px}input:not(.big){width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px}.full{grid-column:1/-1}.modal-actions,.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.secondary{font-size:14px;padding:11px}.status{font-size:11px;color:#6b7280;text-align:center;margin:8px 0}.status.ok{color:#15803d}.status.warn{color:#b45309}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:#111827;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;font-weight:700;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:600px){.top{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>Comida de Vó</h1><div class="sub">Clientes fixos · Créditos e retiradas</div></header>
<main>
<div class="top"><div class="stat"><small>Clientes</small><b id="n">0</b></div><div class="stat"><small>Crédito total</small><b id="credit" class="green">0</b></div><div class="stat"><small>Excedente</small><b id="extra" class="red">0</b></div><div class="stat"><small>Hoje</small><b id="today" class="blue">0</b></div></div>
<section><div class="section-head"><div><h2>Retirada rápida</h2><div class="date" id="date"></div></div><button class="add" onclick="newClient()">+ Cliente</button></div><input id="search" class="search" placeholder="Buscar cliente..." autocomplete="off"><div id="clients"></div></section>
<section><h2>Histórico</h2><div id="history"></div><div class="tools"><button class="secondary" onclick="exportData()">Backup dos dados</button><button class="secondary" onclick="document.getElementById('importFile').click()">Restaurar backup</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(this.files[0])"></div><div id="status" class="status">Carregando dados…</div></section>
</main>
<div id="takeModal" class="modal"><div class="sheet"><h3 id="takeName">Retirada</h3><p>Escolha quantas marmitas o cliente retirou.</p><div class="choices"><button class="choice" onclick="setQty(1)">1</button><button class="choice" onclick="setQty(2)">2</button><button class="choice" onclick="setQty(3)">3</button><button class="choice" onclick="setQty(4)">4</button><button class="choice" onclick="setQty(5)">5</button></div><input id="qty" class="big" type="number" min="1" step="1" value="1" inputmode="numeric"><div class="grid"><div><label>Data</label><input id="dateInput" type="date"></div><div><label>Observação</label><input id="note" placeholder="Opcional"></div></div><div class="modal-actions"><button class="secondary" onclick="closeTake()">Cancelar</button><button class="primary" onclick="confirmTake()">Registrar retirada</button></div></div></div>
<div id="clientModal" class="modal"><div class="sheet"><h3 id="clientTitle">Novo cliente</h3><p>Cadastre ou altere nome e preço.</p><div class="grid"><div class="full"><label>Nome</label><input id="nameInput" placeholder="Ex.: Maria"></div><div><label>Preço por marmita</label><input id="priceInput" type="number" step="0.01" value="18" inputmode="decimal"></div><div id="initialWrap"><label>Crédito inicial</label><input id="initialInput" type="number" min="0" step="1" value="0" inputmode="numeric"></div></div><div class="modal-actions"><button class="secondary" onclick="closeClient()">Cancelar</button><button class="primary" onclick="saveClient()">Salvar</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const KEY='cdv_clientes_v1',DB_NAME='cdv_clientes_db',DB_VERSION=1,STORE='state';let s={clients:[],events:[]},selected=null,editing=null,db=null,busy=false;const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function toast(x){let t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1600)}function setStatus(t,c=''){let el=$('status');el.textContent=t;el.className='status '+c}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function dbGet(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).get('app');r.onsuccess=()=>resolve(r.result?.data||null);r.onerror=()=>reject(r.error)})}function dbPut(data){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({id:'app',data,updatedAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function persist(){try{if(db)await dbPut(s);localStorage.setItem(KEY,JSON.stringify(s));setStatus('Dados salvos com segurança','ok')}catch(e){try{localStorage.setItem(KEY,JSON.stringify(s));setStatus('Salvo no armazenamento do aparelho','warn')}catch(_){setStatus('Não foi possível salvar','warn');throw e}}render()}
async function boot(){try{db=await openDB();let saved=await dbGet();if(saved&&Array.isArray(saved.clients)){s=saved}else{let old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&Array.isArray(old.clients)){s=old;await dbPut(s)}else{s={clients:[],events:[]};await dbPut(s)}}if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});setStatus('Dados salvos neste aparelho','ok')}catch(e){let old=JSON.parse(localStorage.getItem(KEY)||'null');if(old)s=old;setStatus('Modo de segurança: armazenamento local','warn')}render()}
function client(id){return s.clients.find(c=>String(c.id)===String(id))}function newClient(){editing=null;$('clientTitle').textContent='Novo cliente';$('nameInput').value='';$('priceInput').value='18';$('initialInput').value='0';$('initialWrap').style.display='block';$('clientModal').classList.add('open');$('nameInput').focus()}function closeClient(){$('clientModal').classList.remove('open');editing=null}
async function saveClient(){if(busy)return;let name=$('nameInput').value.trim();if(!name)return $('nameInput').focus();busy=true;try{let price=Number($('priceInput').value)||0;if(editing){let c=client(editing);if(!c)return;c.name=name;c.price=price||c.price;await persist();closeClient();toast('Cliente atualizado')}else{let initial=Math.max(0,Math.floor(Number($('initialInput').value)||0));s.clients.push({id:crypto.randomUUID(),name,price:price||0,credit:initial,created:today()});await persist();closeClient();toast('Cliente cadastrado')}}finally{busy=false}}
function openTake(id){selected=id;let c=client(id);if(!c)return;$('takeName').textContent=c.name;$('qty').value=1;$('dateInput').value=today();$('note').value='';$('takeModal').classList.add('open');updateChoices();$('qty').focus()}function closeTake(){$('takeModal').classList.remove('open');selected=null}function setQty(n){$('qty').value=n;updateChoices()}function updateChoices(){document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',Number(b.textContent)===Number($('qty').value)))}
async function confirmTake(){if(busy)return;let c=client(selected),q=Math.max(1,Math.floor(Number($('qty').value)||0));if(!c)return;busy=true;try{c.credit-=q;s.events.unshift({id:crypto.randomUUID(),clientId:c.id,type:'take',qty:q,date:$('dateInput').value||today(),note:$('note').value.trim()});await persist();closeTake();toast(q+' '+(q===1?'marmita retirada':'marmitas retiradas'))}finally{busy=false}}
async function renew(id){if(busy)return;let c=client(id);if(!c)return;let q=prompt('Quantas marmitas '+c.name+' comprou na renovação?','22');if(q===null)return;q=Math.max(1,Math.floor(Number(q)||0));busy=true;try{c.credit+=q;s.events.unshift({id:crypto.randomUUID(),clientId:c.id,type:'renew',qty:q,date:today(),note:'Renovação'});await persist();toast('+'+q+' marmitas de crédito')}finally{busy=false}}
function edit(id){let c=client(id);if(!c)return;editing=id;$('clientTitle').textContent='Editar cliente';$('nameInput').value=c.name;$('priceInput').value=c.price;$('initialWrap').style.display='none';$('clientModal').classList.add('open');$('nameInput').focus()}
async function removeClient(id){if(busy)return;let c=client(id);if(!c||!confirm('Excluir '+c.name+'? O histórico dele também será removido.'))return;busy=true;try{s.clients=s.clients.filter(x=>String(x.id)!==String(id));s.events=s.events.filter(x=>String(x.clientId)!==String(id));await persist();toast('Cliente excluído')}finally{busy=false}}
function render(){let cr=s.clients.reduce((a,c)=>a+Math.max(Number(c.credit)||0,0),0),ex=s.clients.reduce((a,c)=>a+Math.max(-(Number(c.credit)||0),0),0),td=s.events.filter(e=>e.type==='take'&&e.date===today()).reduce((a,e)=>a+(Number(e.qty)||0),0);$('n').textContent=s.clients.length;$('credit').textContent=cr;$('extra').textContent=ex;$('today').textContent=td;$('date').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});let term=$('search').value.trim().toLocaleLowerCase('pt-BR');let visible=s.clients.filter(c=>!term||String(c.name).toLocaleLowerCase('pt-BR').includes(term));$('clients').innerHTML=visible.length?visible.map(c=>{let cr=Math.max(Number(c.credit)||0,0),ex=Math.max(-(Number(c.credit)||0),0);return '<div class="client"><div class="head"><div><div class="name">'+esc(c.name)+'</div><div class="price">'+brl(c.price)+' por marmita</div></div><div class="balance '+(ex?'debt':'credit')+'">'+(ex?ex+' excedente':cr+' de crédito')+'</div></div><div class="extra">Valor excedente: <b>'+brl(ex*c.price)+'</b></div><button class="take" onclick="openTake(\''+c.id+'\')">Retirou</button><div class="actions"><button class="mini" onclick="renew(\''+c.id+'\')">Renovar</button><button class="mini" onclick="edit(\''+c.id+'\')">Editar</button><button class="mini danger" onclick="removeClient(\''+c.id+'\')">Excluir</button></div></div>'}).join(''):'<div class="empty">'+(term?'Nenhum cliente encontrado.':'Nenhum cliente cadastrado.')+'</div>';let rows=s.events.slice(0,30);$('history').innerHTML=rows.length?rows.map(e=>{let c=client(e.clientId);return c?'<div class="history"><div><strong>'+esc(c.name)+'</strong><div class="meta">'+e.date.split('-').reverse().join('/')+' · '+(e.type==='renew'?'Renovação':'Retirada')+(e.note?' · '+esc(e.note):'')+'</div></div><div class="qty '+(e.type==='renew'?'in':'out')+'">'+(e.type==='renew'?'+':'−')+e.qty+'</div></div>':''}).join(''):'<div class="empty">As retiradas e renovações aparecerão aqui.</div>'}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function exportData(){let blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),state:s},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='comida-de-vo-clientes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exportado')}
async function importData(file){if(!file)return;try{let x=JSON.parse(await file.text()),incoming=x.state||x;if(!Array.isArray(incoming.clients)||!Array.isArray(incoming.events))throw new Error();if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;s=incoming;await persist();toast('Backup restaurado')}catch(e){toast('Backup inválido')}}
$('search').addEventListener('input',render);$('qty').addEventListener('input',updateChoices);$('qty').addEventListener('keydown',e=>{if(e.key==='Enter')confirmTake()});
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw-clientes.js',{scope:'./'}).then(reg=>{reg.update().catch(()=>{});if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller&&reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'})})})}).catch(()=>{})}
boot();
</script>
</body>
</html>
