tId)));rows.forEach((row,i)=>{if(row.dataset.editReady)return;const e=display[i];if(!e||e.type!=='take')return;row.dataset.editReady='1';const actions=document.createElement('div');actions.className='history-actions';actions.innerHTML='<button class="history-action">Editar</button><button class="history-action delete">Excluir</button>';row.querySelector('div:first-child')?.appendChild(actions);actions.children[0].addEventListener('click',async()=>{if(busy)return;const n=prompt('Quantidade retirada:',String(e.qty));if(n===null)return;const q=Math.max(0,Math.floor(Number(n)));if(!Number.isFinite(q)){alert('Digite uma quantidade válida.');return}busy=true;try{const c=cls.get(String(e.clientId));if(!c)throw new Error('Cliente não encontrado');const old=Number(e.qty)||0;await setDoc(doc(db,'clientes',e.clientId),{credit:(Number(c.credit)||0)+old-q,updatedAt:Date.now()},{merge:true});if(q===0){await deleteDoc(doc(db,'retiradas',e.id));cacheChange(e.id,old,0,true)}else{await setDoc(doc(db,'retiradas',e.id),{qty:q,clientId:e.clientId,type:e.type,date:e.date,note:e.note||'',createdAt:e.createdAt||Date.now()},{merge:true});cacheChange(e.id,old,q,false)}}catch(err){console.error(err);alert('Não foi possível salvar a alteração.')}finally{busy=false}});actions.children[1].addEventListener('click',async()=>{if(busy)return;if(!confirm('Excluir esta retirada? O crédito do cliente será devolvido.'))return;busy=true;try{const c=cls.get(String(e.clientId));if(!c)throw new Error('Cliente não encontrado');const old=Number(e.qty)||0;await setDoc(doc(db,'clientes',e.clientId),{credit:(Number(c.credit)||0)+old,updatedAt:Date.now()},{merge:true});await deleteDoc(doc(db,'retiradas',e.id));cacheChange(e.id,old,0,true)}catch(err){console.error(err);alert('Não foi possível excluir a retirada.')}finally{busy=false}})})}function start(){onSnapshot(collection(db,'clientes'),s=>{cls=new Map(s.docs.map(d=>[String(d.id),{id:d.id,...d.data()}]));refreshButtons()});onSnapshot(collection(db,'retiradas'),s=>{evs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));refreshButtons()});const target=document.getElementById('history');if(target)new MutationObserver(()=>refreshButtons()).observe(target,{childList:true,subtree:true})}onAuthStateChanged(auth,u=>{if(u)start();else signInAnonymously(auth).catch(()=>{})});</scr`+`ipt>`;document.open();document.write(h.replace('</body>',patch+'</body>'));document.close()}catch(e){document.body.innerHTML='<div style="font-family:system-ui;text-align:center;padding:40px">Não foi possível carregar o aplicativo. Verifique a internet e tente novamente.</div>';console.error(e)}})();</script></body></html>
