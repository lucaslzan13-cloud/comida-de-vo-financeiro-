<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest-clientes.json"><title>Comida de Vó — Clientes Fixos</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}button,input{font:inherit}button{touch-action:manipulation}header{background:#111827;color:#fff;padding:20px 16px 22px;position:sticky;top:0;z-index:10}h1{margin:0;font-size:24px}.sub{opacity:.7;margin-top:4px;font-size:13px}main{max-width:760px;margin:auto;padding:12px 12px 80px}.top{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.stat,section{background:#fff;border-radius:18px;padding:15px;box-shadow:0 2px 10px #0001}.stat small{color:#6b7280}.stat b{display:block;font-size:24px;margin-top:3px}.green{color:#15803d}.red{color:#b91c1c}.blue{color:#1d4ed8}section{margin-bottom:12px}h2{font-size:18px;margin:0 0 12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.date{font-size:12px;color:#6b7280;margin-top:-7px;margin-bottom:12px}.add{border:0;background:#111827;color:#fff;border-radius:11px;padding:10px 13px;font-weight:800}.client{border:1px solid #e5e7eb;border-radius:15px;padding:13px;margin-bottom:9px}.client:last-child{margin-bottom:0}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:850}.price{font-size:12px;color:#6b7280;margin-top:2px}.balance{font-weight:900;font-size:17px;text-align:right}.credit{color:#15803d}.debt{color:#b91c1c}.extra{font-size:12px;color:#6b7280;margin:9px 0 10px}.take{width:100%;border:0;background:#111827;color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.mini{border:0;background:#f3f4f6;border-radius:9px;padding:9px;font-size:12px;font-weight:750}.danger{background:#fee2e2;color:#991b1b}.empty{text-align:center;color:#6b7280;padding:20px}.history{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.history:last-child{border-bottom:0}.meta{font-size:11px;color:#6b7280;margin-top:3px}.qty{font-weight:850}.out{color:#b91c1c}.in{color:#15803d}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:30}.modal.open{display:flex}.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 15px 24px}.sheet h3{margin:0 0 5px;font-size:21px}.sheet p{margin:0 0 14px;color:#6b7280;font-size:13px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}.choice{padding:12px 4px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-weight:850}.choice.active{background:#111827;color:#fff}.big{width:100%;padding:13px;text-align:center;font-size:30px;font-weight:850;border:1px solid #d1d5db;border-radius:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}label{font-size:11px;color:#6b7280;display:block;margin:0 0 4px 2px}input:not(.big){width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px}.full{grid-column:1/-1}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.primary,.secondary{border:0;border-radius:11px;padding:13px;font-weight:800}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:#111827;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;font-weight:700;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:600px){.top{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><h1>Comida de Vó</h1><div class="sub">Clientes fixos · Créditos e retiradas</div></header><main><div class="top"><div class="stat"><small>Clientes</small><b id="n">0</b></div><div class="stat"><small>Crédito total</small><b id="credit" class="green">0</b></div><div class="stat"><small>Excedente</small><b id="extra" class="red">0</b></div><div class="stat"><small>Hoje</small><b id="today" class="blue">0</b></div></div><section><div class="section-head"><div><h2>Retirada rápida</h2><div class="date" id="date"></div></div><button class="add" onclick="newClient()">+ Cliente</button></div><div id="clients"></div></section><section><h2>Histórico</h2><div id="history"></div></section></main><div id="takeModal" class="modal"><div class="sheet"><h3 id="takeName">Retirada</h3><p>Escolha quantas marmitas o cliente retirou hoje.</p><div class="choices"><button class="choice" onclick="setQty(1)">1</button><button class="choice" onclick="setQty(2)">2</button><button class="choice" onclick="setQty(3)">3</button><button class="choice" onclick="setQty(4)">4</button><button class="choice" onclick="setQty(5)">5</button></div><input id="qty" class="big" type="number" min="1" step="1" value="1" inputmode="numeric"><div class="grid"><div><label>Data</label><input id="dateInput" type="date"></div><div><label>Observação</label><input id="note" placeholder="Opcional"></div></div><div class="modal-actions"><button class="secondary" onclick="closeTake()">Cancelar</button><button class="primary" onclick="confirmTake()">Registrar retirada</button></div></div></div><div id="clientModal" class="modal"><div class="sheet"><h3>Novo cliente</h3><p>Cadastre nome, preço e crédito inicial.</p><div class="grid"><div class="full"><label>Nome</label><input id="nameInput" placeholder="Ex.: Maria"></div><div><label>Preço por marmita</label><input id="priceInput" type="number" step="0.01" value="18" inputmode="decimal"></div><div><label>Crédito inicial</label><input id="initialInput" type="number" min="0" step="1" value="0" inputmode="numeric"></div></div><div class="modal-actions"><button class="secondary" onclick="closeClient()">Cancelar</button><button class="primary" onclick="saveClient()">Cadastrar</button></div></div></div><div id="toast" class="toast"></div><script>const KEY='cdv_clientes_v1';let s=JSON.parse(localStorage.getItem(KEY)||'null')||{clients:[],events:[]},selected=null;const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}function client(id){return s.clients.find(c=>c.id===id)}function newClient(){$('clientModal').classList.add('open');$('nameInput').focus()}function closeClient(){$('clientModal').classList.remove('open')}function saveClient(){let name=$('nameInput').value.trim();if(!name)return $('nameInput').focus();let price=Number($('priceInput').value)||0,initial=Math.max(0,Math.floor(Number($('initialInput').value)||0));s.clients.push({id:Date.now(),name,price,credit:initial,created:today()});save();closeClient();$('nameInput').value='';toast('Cliente cadastrado')}function openTake(id){selected=id;let c=client(id);$('takeName').textContent=c.name;$('qty').value=1;$('dateInput').value=today();$('note').value='';$('takeModal').classList.add('open');updateChoices();$('qty').focus()}function closeTake(){$('takeModal').classList.remove('open');selected=null}function setQty(n){$('qty').value=n;updateChoices()}function updateChoices(){document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',Number(b.textContent)===Number($('qty').value)))}function confirmTake(){let c=client(selected),q=Math.max(1,Math.floor(Number($('qty').value)||0));if(!c)return;c.credit-=q;s.events.unshift({id:Date.now(),clientId:c.id,type:'take',qty:q,date:$('dateInput').value||today(),note:$('note').value.trim()});save();closeTake();toast(q+' '+(q===1?'marmita retirada':'marmitas retiradas'))}function renew(id){let c=client(id),q=prompt('Quantas marmitas '+c.name+' comprou na renovação?','22');if(q===null)return;q=Math.max(1,Math.floor(Number(q)||0));c.credit+=q;s.events.unshift({id:Date.now(),clientId:c.id,type:'renew',qty:q,date:today(),note:'Renovação'});save();toast('+'+q+' marmitas de crédito')}function edit(id){let c=client(id),name=prompt('Nome:',c.name);if(name===null)return;let p=prompt('Preço por marmita:',c.price);if(p===null)return;c.name=name.trim()||c.name;c.price=Number(p)||c.price;save();toast('Cliente atualizado')}function removeClient(id){let c=client(id);if(!confirm('Excluir '+c.name+'? O histórico dele também será removido.'))return;s.clients=s.clients.filter(x=>x.id!==id);s.events=s.events.filter(x=>x.clientId!==id);save();toast('Cliente excluído')}function render(){let cr=s.clients.reduce((a,c)=>a+Math.max(c.credit,0),0),ex=s.clients.reduce((a,c)=>a+Math.max(-c.credit,0),0),td=s.events.filter(e=>e.type==='take'&&e.date===today()).reduce((a,e)=>a+e.qty,0);$('n').textContent=s.clients.length;$('credit').textContent=cr;$('extra').textContent=ex;$('today').textContent=td;$('date').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});$('clients').innerHTML=s.clients.length?s.clients.map(c=>{let cr=Math.max(c.credit,0),ex=Math.max(-c.credit,0);return '<div class="client"><div class="head"><div><div class="name">'+esc(c.name)+'</div><div class="price">'+brl(c.price)+' por marmita</div></div><div class="balance '+(ex?'debt':'credit')+'">'+(ex?ex+' excedente':cr+' de crédito')+'</div></div><div class="extra">Valor excedente: <b>'+brl(ex*c.price)+'</b></div><button class="take" onclick="openTake('+c.id+')">Retirou</button><div class="actions"><button class="mini" onclick="renew('+c.id+')">Renovar</button><button class="mini" onclick="edit('+c.id+')">Editar</button><button class="mini danger" onclick="removeClient('+c.id+')">Excluir</button></div></div>'}).join(''):'<div class="empty">Nenhum cliente cadastrado.</div>';let rows=s.events.slice(0,30);$('history').innerHTML=rows.length?rows.map(e=>{let c=client(e.clientId);return c?'<div class="history"><div><strong>'+esc(c.name)+'</strong><div class="meta">'+e.date.split('-').reverse().join('/')+' · '+(e.type==='renew'?'Renovação':'Retirada')+(e.note?' · '+esc(e.note):'')+'</div></div><div class="qty '+(e.type==='renew'?'in':'out')+'">'+(e.type==='renew'?'+':'−')+e.qty+'</div></div>':''}).join(''):'<div class="empty">As retiradas e renovações aparecerão aqui.</div>'}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(x){let t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1600)}$('qty').addEventListener('input',updateChoices);$('qty').addEventListener('keydown',e=>{if(e.key==='Enter')confirmTake()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw-clientes.js',{scope:'./'}).catch(()=>{});if(!s.clients.length){s.clients=[{id:1,name:'Marcelo',price:18,credit:0,created:today()},{id:2,name:'Renata',price:16,credit:0,created:today()},{id:3,name:'Divina',price:16,credit:0,created:today()},{id:4,name:'Tiago',price:18,credit:0,created:today()}];localStorage.setItem(KEY,JSON.stringify(s))}render();</script></body></html>
